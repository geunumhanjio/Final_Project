version: '3.8'

services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wsl_ros2
    hostname: wsl_ros2
    network_mode: host

    environment:
      - DISPLAY=127.0.0.1:0  # 여기 수정
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=/root/cyclonedds.xml
      - PYTHONUNBUFFERED=1
      - RCUTILS_COLORIZED_OUTPUT=1

    volumes:
      - ../src:/root/ros2_ws/src
      - ./cyclonedds.xml:/root/cyclonedds.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm

    stdin_open: true
    tty: true
    restart: unless-stopped

    command: /bin/bash
