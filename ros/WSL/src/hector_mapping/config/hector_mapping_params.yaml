# ============================================================
# hector_mapping_params.yaml
# YDLiDAR X4 + 차동구동 로봇 기준
#
# [모드 선택]
# 완전 scan-only (odom 불필요):
#   odom_frame: base_footprint   ← base_frame과 동일하게 설정
#   pub_map_odom_transform: true ← map→base_footprint TF 직접 발행
#
# odom 연동 모드 (relay_ekf와 함께):
#   odom_frame: odom
#   pub_map_odom_transform: true ← map→odom TF 발행
# ============================================================
hector_mapping:
  ros__parameters:

    # 좌표계
    base_frame:  base_footprint
    map_frame:   map
    # odom_frame: 런치 파일에서 오버라이드 가능
    # - "odom"         → map→odom TF 발행, relay_ekf와 연동 (navigation 모드)
    # - "base_footprint" → map→base_footprint TF 직접 발행 (scan-only 순수 테스트)
    odom_frame:  odom

    # 스캔 토픽
    scan_topic:  scan

    # TF 발행
    pub_map_odom_transform:      true
    pub_map_scanmatch_transform: false
    tf_map_scanmatch_transform_frame_name: scanmatcher_frame

    # scan→base TF 변환 사용 여부
    # true:  laser_frame→base_footprint TF 조회하여 정확한 포인트 변환
    # false: laser가 base 원점에 있다고 가정 (간단하지만 약간 부정확)
    use_tf_scan_transformation: true

    # 맵 설정
    map_resolution:       0.05   # 5cm/픽셀
    map_size:             512    # 512×512 = 25m×25m (실내 충분), 발행 데이터 1/16로 감소
    map_start_x:          0.5
    map_start_y:          0.5
    map_multi_res_levels: 3       # 2→3: 코스→파인 3단계 ICP → 빠른 회전에도 수렴 안정성↑
    map_pub_period:       4.0    # 맵 업데이트 후 최소 발행 간격 (초)

    # 맵 업데이트 조건
    update_factor_free:          0.4
    update_factor_occupied:      0.9
    map_update_distance_thresh:  0.05  # 5cm 이동 시 업데이트
    map_update_angle_thresh:     0.15  # 0.087→0.15(~9°): 빠른 회전 중 맵 업데이트 억제

    # YDLiDAR X4 스캔 범위
    laser_min_dist:   0.12
    laser_max_dist:   8.0
    laser_z_min_value: -1.0
    laser_z_max_value:  1.0

    # odometry 토픽 발행 (nav_msgs/Odometry on /odom_hector) - Nav2는 /odom_relay 직접 사용하므로 불필요
    pub_odometry: false

    # 서비스 / 기타
    advertise_map_service:      true
    scan_subscriber_queue_size: 5
