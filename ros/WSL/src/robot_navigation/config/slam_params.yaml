# ============================================================
# slam_params.yaml - SLAM Toolbox 설정
# YDLiDAR X4 + 차동구동 로봇 기준
#
# [핵심 전략: scan-only 모드]
# odom_frame: base_footprint  (== base_frame)
#   → base_footprint→base_footprint TF = identity
#   → SLAM Toolbox가 모션 예측에 odom을 전혀 사용하지 않음
#   → 이전 SLAM pose에서 직접 scan matching (HectorSLAM 방식)
#   → WiFi 지연·encoder 오차·EKF jitter 영향 완전 차단
#
# search_space: ±5cm (0.1m)
#   → minimum_time_interval: 0.2s × 0.12m/s = 처리 scan 간 최대 이동 2.4cm
#   → odom prior 없이 이전 SLAM pose 기준 탐색해도 충분히 커버
#
# do_loop_closing: true
#   → 루프 클로져는 유지. 긴 경로 drift 보정.
# ============================================================

slam_toolbox:
  ros__parameters:

    # 플러그인 설정
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # 좌표계
    odom_frame: odom            # 표준 TF 구조 유지 (map→odom은 SLAM 발행)
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    # 동작 모드
    mode: mapping               # mapping or localization

    # 맵 업데이트 설정
    map_update_interval: 1.0    # 초 (내부 업데이트 주기)
    resolution: 0.05            # 맵 해상도 5cm/픽셀

    # 스캔 범위 (YDLiDAR X4 스펙: 최소 0.12m, 최대 10m)
    minimum_laser_range: 0.15   # 근접 노이즈 제거 (로봇 몸체 반사)
    max_laser_range: 8.0        # 실내 환경 8m

    # 노드 추가 조건
    minimum_travel_distance: 0.05  # 5cm 이상 이동 시 새 노드 추가
    minimum_travel_heading: 0.087  # ~5도 이상 회전 시 새 노드 추가

    # 스캔 버퍼 (주로 루프 클로져에 사용)
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.35
    distance_decomposition_radius: 3.5
    scan_sensor_offset: 0.0

    # 루프 클로져
    # 충분히 이동 후 신뢰도 높은 매칭만 수락
    do_loop_closing: true
    loop_match_minimum_chain_size: 10      # 0.5m 이상 이동 후 루프 시도
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.4
    loop_match_minimum_response_fine: 0.55

    # ── 상관관계 검색 ────────────────────────────────────────────────────
    # scan-only 모드: 이전 SLAM pose 기준 탐색
    # 처리 scan 간 최대 이동 = 0.2s × 0.12m/s = 2.4cm → ±5cm (0.1m)으로 충분
    # 방향: ±20° → PID heading drift 보상
    correlation_search_space_dimension: 0.1    # ±5cm (odom 없어도 scan 간격 커버)
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    # 각도 검색: ±20° (PID 누적 drift 보상)
    coarse_search_angle_offset: 0.349   # ±20°
    coarse_angle_resolution: 0.035      # 2° 단위

    # 루프 클로져 검색 공간
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # 거리 penalty: search_space가 이미 ±5cm로 제한되어 있어 penalty는 보조 역할
    distance_variance_penalty: 1.5
    angle_variance_penalty: 0.5         # 각도 보정 자유도 유지
    fine_search_angle_offset: 0.00349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # TF 관련
    tf_buffer_duration: 30.0
    transform_publish_period: 0.02   # 50Hz TF 발행
    transform_timeout: 0.2

    # 스택 크기
    stack_size_to_use: 40000000

    # ── 핵심 설정 ────────────────────────────────────────────────────────
    use_scan_matching: true     # 방향 보정용 ON (translation은 ±5cm로 제한됨)
    use_scan_barycenter: false
    enable_interactive_mode: true
    throttle_scans: 1
    minimum_time_interval: 0.2
