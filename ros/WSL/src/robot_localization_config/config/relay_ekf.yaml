    # RPi EKF → /odom → scan_relay → /odom_relay 를 입력으로 사용
    odom0: /odom_relay
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative:     false
    odom0_queue_size:   20

    # odom→base_footprint TF 발행 (WiFi 갭 구간도 예측으로 연속 발행)
    publish_tf:       true
    print_diagnostics: false
    reset_on_time_jump: false
