version: '3.8'

services:
  rpi_ros2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpi_ros2
    hostname: rpi_ros2
    network_mode: host
    privileged: true

    devices:
      - /dev/serial0:/dev/serial0:rwm
      - /dev/ttyAMA0:/dev/ttyAMA0:rwm
      - /dev/ttyUSB0:/dev/ttyUSB0:rwm
      - /dev/ttyUSB1:/dev/ttyUSB1:rwm
      - /dev/video0:/dev/video0

    environment:
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=/root/cyclonedds.xml
      - PYTHONUNBUFFERED=1
      - RCUTILS_COLORIZED_OUTPUT=1
      - LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu:/usr/lib:${LD_LIBRARY_PATH}
      - PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:${PKG_CONFIG_PATH}

    volumes:
      - ../ros2_ws/src:/root/ros2_ws/src
      - ./cyclonedds.xml:/root/cyclonedds.xml:ro
      - /dev/shm:/dev/shm
      - /run/udev:/run/udev:ro
      - /dev:/dev
      - libcamera_cache:/usr/lib/aarch64-linux-gnu
      - build_cache:/root/ros2_ws/build
      - install_cache:/root/ros2_ws/install

    stdin_open: true
    tty: true
    restart: unless-stopped

    command: /bin/bash

volumes:
  libcamera_cache:
  build_cache:
  install_cache:
