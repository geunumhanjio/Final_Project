serial_bridge_node:
  ros__parameters:
    # === 시리얼 포트 설정 ===
    serial_port: "/dev/serial0"  # /dev/ttyAMA0 대신 /dev/serial0 사용
    baud_rate: 115200

    # === 로봇 물리 파라미터 (실측값) ===
    wheel_base: 0.100             # m (유효 kinematic wheel_base 실측 보정값)
    wheel_radius: 0.0325          # m (65mm 지름 → 반경 32.5mm)
    encoder_ticks_per_rev: 3840   # 480 CPR × 4체배 × 기어비 2 (실측 보정)

    # === IMU 스케일 팩터 ===
    # MPU6050: ±2g, ±250°/s
    imu_accel_scale: 0.000598     # m/s² per LSB  (9.8 / 16384)
    imu_gyro_scale: 0.000133      # rad/s per LSB  (250/32768 × π/180)

    # === 좌표계 변환 ===
    # true로 설정하면 transformImuData() 함수에서 좌표계 변환 수행
    imu_transform_enabled: false

    # === 프레임 ID ===
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    imu_frame_id: "imu_link"

    # === 타이밍 설정 ===
    # STM32 타임아웃(500ms) 방지를 위해 200ms(5Hz)마다 재전송
    cmd_vel_repeat_rate: 5.0  # Hz

    # === 오도메트리 데이터 타입 ===
    # "ticks"    : 엔코더 틱 카운트 (STM32가 50ms 주기 delta 전송)
    # "velocity" : 바퀴 속도 (mm/s)
    odom_data_type: "ticks"

    # === CSV 로깅 ===
    # true로 설정하면 UART 송수신 내역을 CSV 파일로 저장
    csv_log_enabled: true
    csv_log_path: "/root/ros2_ws/log/serial_bridge_log.csv"
